name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm --filter @stacks/web build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      # Applies every migration to a throwaway local stack, then proves the RLS
      # policies with pgTAP. A policy regression fails the PR, not production.
      - run: supabase db start
      - run: supabase test db

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: pnpm install --frozen-lockfile
      # The browser binary comes from Playwright's own CDN. --with-deps would run
      # apt-get update, and the runner image carries a Google Chrome apt source
      # whose index has been serving a hash mismatch; the shared libraries
      # Playwright needs are already on the ubuntu image.
      - run: pnpm --filter @stacks/web exec playwright install chromium
      # A throwaway Supabase stack, then the real bundle against it. The test
      # signs up, shelves a book and logs a sitting the way a reader would.
      - run: supabase start
      - name: point the bundle at the local stack
        run: |
          echo "VITE_SUPABASE_URL=$(supabase status -o env | grep '^API_URL' | cut -d= -f2- | tr -d '\"')" >> apps/web/.env
          echo "VITE_SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY' | cut -d= -f2- | tr -d '\"')" >> apps/web/.env
      - run: pnpm --filter @stacks/web exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
